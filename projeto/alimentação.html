<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="assets/style/escolhas.css">
    <link rel="shortcut icon" href="assets/img/logo-1.png" type="image/x-icon">

    <script src="loja.js" async></script>

    <title>Fit Fusion</title>
  </head>
  <body>

    <header>
      <nav>
          <div class="logo">
              <a href="index.html"><img src="assets/img/logo-fit.png" draggable="false"></a>
          </div>
          <div class="nav-options">
            <p>HOME</p>
            <p>ABOUT US</p>
            <a href="calculadora.html"><p>IMC</p></a>
            <p>CLASSES</p>
            <p>OUR TEAM</p>
            <p>PAGES</p>
            <p>CONTACT</p>
          </div>
          
          <div class="itens-lateral">
          
            <div class="social-midia">
              <img src="assets/img/facebook .png" draggable="false">
              <img src="assets/img/twitter.png" draggable="false">
              <img src="assets/img/youtube.png" draggable="false">
              <img src="assets/img/instagram.png" draggable="false">
  
            </div>

           
          </div>

          <div class="menu">
            <img src="assets/img/menu.png"draggable="false" onclick="toggleMenu(this)">
            <div class="modal-menu hidden">
              <section>
                <div class="modal-header">
                  <h1>Tabela de alimentação</h1>
                  <p id="modal-close">Sair</p>
                </div>
                <table class="product-table">
                  <thead>
                    <tr>
                      <th>Item</th>
                      <th>Quantidade</th>
                      <th>Ação</th>
                    </tr>
                  </thead>
                  <tbody></tbody>
                </table>
                <button type="button" class="purchase-button">Finalizar Tabela</button>
                
              </section>
            </div>
          </div>
      </nav>
  </header>


  <main> 
    <div class="healt-front">
      <div class="box-text-healty">
        <div class="head">
          <P>it's time to change!</h1>
        </div>
        <div class="body-text-healty">
          <div class="text-principal">
            <h1>MELHORE E APRIMORE</h1>
          </div>
          <div class="subtext-healty">
            <h1 style="color: #8C52FF";> SUA SAÚDE</h1>
            <h1 >AGORA!</h1>
          </div>
          
        </div>
      </div>
     
      <img src="assets/img/prato.png" class="wallpaper-img" draggable="false">
      
    </div>
</main>


    <main class="main-section">
      <section class="container normal-section">
        <h2 class="section-title">Monte sua Alimentação!</h2>

        <div class="products-container">

          <div class="movie-product">
            <img src="images/carboidrato.png" style="margin: 15px;" alt="Poster 1" class="product-image">
            <strong class="product-title">Carboidratos</strong>
            
            <div class="product-price-container">
              <span class="product-price"></span>
              <button type="button" class="button-hover-background">+</button>
            </div>
          </div>

          <div class="movie-product">
            <img src="images/laticinios.png" alt="Poster 1" class="product-image">
            <strong class="product-title">Laticínios</strong>
            
            <div class="product-price-container">
              <span class="product-price"></span>
              <button type="button" class="button-hover-background">+</button>
            </div>
          </div>
  
          <div class="movie-product">
            <img src="images/proteina.png" alt="Poster 1" class="product-image">
            <strong class="product-title">Proteinas</strong>
            
            <div class="product-price-container">
              <span class="product-price"></span>
              <button type="button" class="button-hover-background">+</button>
            </div>
          </div>
  
          <div class="movie-product">
            <img src="images/frutas.png" alt="Poster 1" class="product-image">
            <strong class="product-title">Frutas</strong>
            
            <div class="product-price-container">
              <span class="product-price"></span>
              <button type="button" class="button-hover-background">+</button>
            </div>
          </div>
        </div>
      </section>
